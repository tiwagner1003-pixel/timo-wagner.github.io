<!-- Robust dark-mode include: load dark-mode.js if present -->
<div id="quarto-dark-mode-placeholder">
  <script>
    (function(){
      var path = 'site_libs/dark-mode/dark-mode.js';
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD', path, false);
        xhr.send();
        if (xhr.status === 200) {
          var s = document.createElement('script');
          s.src = path;
          s.defer = true;
          document.head.appendChild(s);
        }
      } catch (e) {
        // silent fallback if file not present or request blocked
        console.debug('dark-mode script not loaded:', e);
      }
    })();
  </script>
</div>
