<button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode" class="nav-link">
  <i class="bi-moon-fill" aria-hidden="true"></i>
</button>

<!-- Move the toggle into the navbar tools container so it appears properly aligned with search -->
<script src="site_libs/dark-mode/dark-mode.js"></script>
<script>
  (function(){
    function moveToggle(){
      const btn = document.getElementById('theme-toggle');
      if(!btn) return;
      const tools = document.querySelector('.quarto-navbar-tools');
      if(tools && !tools.querySelector('#theme-toggle')){
        tools.appendChild(btn);
      }
    }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', moveToggle);
    else moveToggle();
  })();
</script>
